name: Bidding Announcements Sync

on:
  # 2026-06-19: 移除 GitHub 內建 schedule，改由外部 cronjob（cron-job.org）經 workflow_dispatch 觸發。
  # 與 plate-sync / bidding-plates 一致：避免 schedule + cronjob 雙源觸發同一 concurrency group。
  workflow_dispatch: {}

concurrency:
  group: bidding-announcements-sync-workflow
  cancel-in-progress: false

jobs:
  sync-announcements:
    runs-on: ubuntu-latest
    # 防止單次 run 卡死霸佔 concurrency slot（GitHub 預設 360 分=6 小時）。正常只跑 1~4 分。
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install and Configure Cloudflare WARP
        # 2026-11-10（健檢 O7）：步驟層上限（時間預算見下方安裝函式註解），卡住時在 job 的
        # 10 分鐘 timeout 之前明確失敗，而不是讓整個 job 被取消、爬完卻沒寫入（11/9 兩輪各卡 7.5 分鐘）。
        timeout-minutes: 7
        run: |
          # Import GPG key and add repository
          curl -fsSL --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 3 https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list

          # Install WARP。2026-11-10 第二版：兩段式（先下載、再解包）＋整體 deadline。
          # 為什麼：11/10 14:05 為止 Bidding Plates 近 64 輪有 7 輪死在這一步（上線前 11/5–11/9 同一步驟 716 輪有 23 輪被
          # job 10 分鐘 timeout 取消、其中 19 輪在 11/6 一天）。7 輪的 log 都是 azure.archive.ubuntu.com 慢／間歇卡住
          # （Ign: 15–30 秒空窗、libwebkit2gtk 25.7 MB 單檔停滯），其中一輪 236 秒才下載完 125 MB，TERM 落在 dpkg 解包而失敗。
          # 舊版把「下載＋解包」塞進同一個 240 秒的 install：下載慢會吃掉解包的時間、TERM 又可能砍在 dpkg 中途。
          # 新版：
          #   1. update           第 1 輪完整更新 ≤60 秒（實測正常 ~4 秒）；失敗則第 2 輪只更新 Cloudflare 來源 ≤30 秒
          #   2. install --download-only  最多 3 輪，每輪 ≤100 秒。apt 的半成品下載會留在 archives/partial 續傳，
          #                       已下載完的 .deb 保留；被 TERM 砍掉不會動到 dpkg，安全，且每輪重新建立連線以脫離卡住的連線。
          #   3. install          只剩解包（本機 .deb），最多 2 輪，每輪 ≤120 秒；若 TERM 落在 dpkg 中途，先 dpkg --configure -a 再續一輪。
          # 整體預算：函式起算 330 秒（WARP_APT_BUDGET 可覆寫，供測試），下載階段永遠替解包保留 60 秒；每個階段的上限
          # 都會被「剩餘預算」再夾一次，所以不會因為前面慢就讓後面無上限。
          #   正常失敗輪 ≈ 金鑰 1 ＋ 函式 330 ＋ WARP 註冊／連線 ~25 ≈ 6 分鐘（步驟上限 7 分鐘）；
          #   極端（金鑰下載也卡滿 96 秒）由 7 分鐘步驟上限把關，明確失敗。
          #   後續步驟（Setup Node＋npm ci＋同步）p50 19 秒、p99 191 秒、max 201 秒（11/5–11/10 共 767 輪）；
          #   job 上限 10 分鐘：330 ＋ checkout 與金鑰約 5 ＋ WARP 設定約 30 ＋ Verify IP 最多約 25 ＋ 後續最大 201 ≈ 590 秒，
          #   仍在 600 內但餘裕只剩約 10 秒（舊版單次 240 秒 install 的最壞情況本來就會超過）。
          # Acquire::Retries=2／Timeout=15／20 維持不變：log 顯示它們有在作用（Ign: 後重試），調大只會讓每次卡住更久。
          install_warp_bounded() {
            local DEADLINE=$((SECONDS + ${WARP_APT_BUDGET:-330}))
            local UNPACK_RESERVE=60
            local TRY CAP REM DOWNLOADED=false
            local APT_OPTS=(-o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=20 -o Dpkg::Use-Pty=0)

            for TRY in 1 2; do
              REM=$((DEADLINE - SECONDS - UNPACK_RESERVE)); CAP=60
              local SCOPE=()
              if [ "$TRY" -eq 2 ]; then
                # 第 1 輪逾時幾乎都是 Ubuntu 鏡像（azure.archive.ubuntu.com）的索引卡住（11/11 兩輪：Cloudflare 索引 1 秒內到、
                # 鏡像三個 suite 各卡 ~18 秒）。重試整份只會再卡一次，所以第 2 輪只更新 Cloudflare 來源，
                # Ubuntu 套件清單沿用 runner 映像內既有的（若版本已過期，下載階段會明確失敗，不比原本差）。
                SCOPE=(-o Dir::Etc::sourcelist=sources.list.d/cloudflare-client.list -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0); CAP=30
                echo "::warning::falling back to Cloudflare-only apt index (Ubuntu lists from the runner image are reused)."
              fi
              if [ "$CAP" -gt "$REM" ]; then CAP=$REM; fi
              if [ "$CAP" -lt 10 ]; then echo "::warning::WARP install budget exhausted before apt-get update."; return 1; fi
              echo "apt-get update attempt $TRY/2 (cap ${CAP}s)..."
              if sudo timeout --signal=TERM --kill-after=10s "${CAP}s" \
                   apt-get "${APT_OPTS[@]}" "${SCOPE[@]}" update; then
                break
              fi
              echo "::warning::apt-get update attempt $TRY failed or timed out."
              if [ "$TRY" -ge 2 ]; then return 1; fi
              sleep 3
            done

            for TRY in 1 2 3; do
              REM=$((DEADLINE - SECONDS - UNPACK_RESERVE)); CAP=100
              if [ "$CAP" -gt "$REM" ]; then CAP=$REM; fi
              if [ "$CAP" -lt 10 ]; then echo "::warning::WARP install budget exhausted during download."; break; fi
              echo "apt-get install --download-only attempt $TRY/3 (cap ${CAP}s)..."
              if sudo timeout --signal=TERM --kill-after=10s "${CAP}s" \
                   env DEBIAN_FRONTEND=noninteractive \
                   apt-get "${APT_OPTS[@]}" install -y --download-only cloudflare-warp; then
                DOWNLOADED=true
                break
              fi
              echo "::warning::download attempt $TRY failed or timed out (partial files are kept and resumed)."
              sleep 2
            done
            if [ "$DOWNLOADED" != "true" ]; then return 1; fi

            for TRY in 1 2; do
              REM=$((DEADLINE - SECONDS)); CAP=120
              if [ "$CAP" -gt "$REM" ]; then CAP=$REM; fi
              if [ "$CAP" -lt 10 ]; then echo "::warning::WARP install budget exhausted before unpack."; return 1; fi
              echo "apt-get install (unpack from local .deb) attempt $TRY/2 (cap ${CAP}s)..."
              if sudo timeout --signal=TERM --kill-after=10s "${CAP}s" \
                   env DEBIAN_FRONTEND=noninteractive \
                   apt-get "${APT_OPTS[@]}" install -y cloudflare-warp; then
                return 0
              fi
              echo "::warning::unpack attempt $TRY failed or timed out; finishing any half-configured packages."
              # 最後一輪失敗後不必收尾（函式即將回傳失敗），省下最多 65 秒、不逼近步驟上限
              if [ "$TRY" -lt 2 ]; then sudo timeout --signal=TERM --kill-after=5s 60s dpkg --configure -a || true; fi
            done
            return 1
          }
          if ! install_warp_bounded; then
            echo "::error::Cloudflare WARP package installation failed or timed out after bounded retries (download/unpack two-phase)."
            exit 1
          fi

          # Register
          sudo warp-cli registration new --accept-tos 2>/dev/null || \
          sudo warp-cli --accept-tos registration new 2>/dev/null || true

          # Hardcode and Exclude Supabase IP from WARP
          SUB_DOMAIN=$(echo ${{ secrets.VITE_SUPABASE_URL }} | sed -E 's/https?:\/\/([^\/]+).*/\1/')
          SUB_IP=$(nslookup $SUB_DOMAIN | grep 'Address:' | tail -n1 | awk '{print $2}')
          if [ ! -z "$SUB_IP" ]; then
            echo "Hardcoding Supabase IP: $SUB_IP for $SUB_DOMAIN in /etc/hosts"
            echo "$SUB_IP $SUB_DOMAIN" | sudo tee -a /etc/hosts

            echo "Excluding Supabase IP: $SUB_IP from WARP"
            sudo warp-cli add-excluded-route $SUB_IP/32 2>/dev/null || \
            sudo warp-cli --accept-tos add-excluded-route $SUB_IP/32 2>/dev/null || true
          fi

          # Connect
          sudo warp-cli connect 2>/dev/null || \
          sudo warp-cli --accept-tos connect 2>/dev/null || true

          # Wait for connection to stabilize
          echo "Waiting for WARP connection..."
          sleep 15

          # Verify connection status
          sudo warp-cli status 2>/dev/null || \
          sudo warp-cli --accept-tos status 2>/dev/null || true

      - name: Verify IP and MVDIS Connectivity
        run: |
          echo "=== IP / WARP Check ==="
          CURRENT_IP=$(curl -s --max-time 15 ifconfig.me || echo "FAILED")
          echo "Current IP: $CURRENT_IP"

          COUNTRY=$(curl -s --max-time 10 "https://ipinfo.io/${CURRENT_IP}/country" 2>/dev/null | tr -d '[:space:]' || echo "UNKNOWN")
          echo "IP Country: $COUNTRY"
          if [ "$COUNTRY" = "TW" ]; then
            echo "WARP verified: IP is from Taiwan"
          else
            echo "WARNING: IP country is $COUNTRY (expected TW). MVDIS may block requests."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Run Announcements Sync
        run: node bid-announce-sync.cjs
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NODE_OPTIONS: '--dns-result-order=ipv4first'
