name: Bidding Announcements Sync

on:
  # 2026-06-19: 移除 GitHub 內建 schedule，改由外部 cronjob（cron-job.org）經 workflow_dispatch 觸發。
  # 與 plate-sync / bidding-plates 一致：避免 schedule + cronjob 雙源觸發同一 concurrency group。
  workflow_dispatch: {}

concurrency:
  group: bidding-announcements-sync-workflow
  cancel-in-progress: false

jobs:
  sync-announcements:
    runs-on: ubuntu-latest
    # 防止單次 run 卡死霸佔 concurrency slot（GitHub 預設 360 分=6 小時）。正常只跑 1~4 分。
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # 2026-11-11：21:55 起 runner 連不到 Ubuntu 套件鏡像（azure 與 archive 兩個、IPv4／IPv6 皆逾時），
      # 相依套件（約 50 MB）下載不下來。車牌同步（setup-plate-runner）不受影響是因為它快取了 .deb。
      # 這裡唯讀沿用同一份快取（同 repo、同 path；用不會命中的 key 讓 restore-keys 取最新一份），不另存。
      # 2026-11-15（WARP 審查 M2）：優先取同一個 runner 映像版本的快取，沒有才退到任何版本。
      - name: Detect runner image version
        id: runner-image
        run: echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Restore cached WARP apt packages (shared with plate-sync)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: ~/.warp-apt-cache
          key: warp-apt-${{ runner.os }}-bidding-readonly-${{ github.run_id }}
          restore-keys: |
            warp-apt-${{ runner.os }}-${{ steps.runner-image.outputs.version }}-
            warp-apt-${{ runner.os }}-

      - name: Install and Configure Cloudflare WARP
        # 2026-11-10（健檢 O7）：步驟層上限（時間預算見下方安裝函式註解），卡住時在 job 的
        # 10 分鐘 timeout 之前明確失敗，而不是讓整個 job 被取消、爬完卻沒寫入（11/9 兩輪各卡 7.5 分鐘）。
        timeout-minutes: 7
        run: |
          # Import GPG key and add repository
          curl -fsSL --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 3 https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list

          # Install WARP。2026-11-10 第二版：兩段式（先下載、再解包）＋整體 deadline。
          # 為什麼：11/10 14:05 為止 Bidding Plates 近 64 輪有 7 輪死在這一步（上線前 11/5–11/9 同一步驟 716 輪有 23 輪被
          # job 10 分鐘 timeout 取消、其中 19 輪在 11/6 一天）。7 輪的 log 都是 azure.archive.ubuntu.com 慢／間歇卡住
          # （Ign: 15–30 秒空窗、libwebkit2gtk 25.7 MB 單檔停滯），其中一輪 236 秒才下載完 125 MB，TERM 落在 dpkg 解包而失敗。
          # 舊版把「下載＋解包」塞進同一個 240 秒的 install：下載慢會吃掉解包的時間、TERM 又可能砍在 dpkg 中途。
          # 新版：
          #   1. update           第 1 輪 ≤30 秒（正常 3–17 秒）；卡住就把 Ubuntu 鏡像換成 archive.ubuntu.com 再更新 ≤45 秒；
          #                       仍失敗則只更新 Cloudflare 來源 ≤30 秒（有快取時直接從這裡開始，最多 3 輪 30／40／40 秒）。下載輪失敗後同樣會換鏡像。
          #   2. install --download-only  最多 3 輪，每輪 ≤100 秒。apt 的半成品下載會留在 archives/partial 續傳，
          #                       已下載完的 .deb 保留；被 TERM 砍掉不會動到 dpkg，安全，且每輪重新建立連線以脫離卡住的連線。
          #      有快取時（11/15）：update 後逐檔比對快取 .deb 的 SHA256 才採用；下載被 apt 回報錯誤（非逾時）時補一次完整 update ≤45 秒。
          #   3. install          只剩解包（本機 .deb），最多 2 輪，每輪 ≤120 秒；若 TERM 落在 dpkg 中途，先 dpkg --configure -a 再續一輪。
          # 整體預算：函式起算 330 秒（WARP_APT_BUDGET 可覆寫，供測試），下載階段永遠替解包保留 60 秒；每個階段的上限
          # 都會被「剩餘預算」再夾一次，所以不會因為前面慢就讓後面無上限。
          #   正常失敗輪 ≈ 金鑰 1 ＋ 函式 330 ＋ WARP 註冊／連線 ~25 ≈ 6 分鐘（步驟上限 7 分鐘）；
          #   極端（金鑰下載也卡滿 96 秒）由 7 分鐘步驟上限把關，明確失敗。
          #   後續步驟（Setup Node＋npm ci＋同步）p50 19 秒、p99 191 秒、max 201 秒（11/5–11/10 共 767 輪）；
          #   job 上限 10 分鐘：330 ＋ checkout 與金鑰約 5 ＋ WARP 設定約 30 ＋ Verify IP 最多約 25 ＋ 後續最大 201 ≈ 590 秒，
          #   仍在 600 內但餘裕只剩約 10 秒（舊版單次 240 秒 install 的最壞情況本來就會超過）。
          # Acquire::Retries=2／Timeout=15／20 維持不變：log 顯示它們有在作用（Ign: 後重試），調大只會讓每次卡住更久。
          install_warp_bounded() {
            local DEADLINE=$((SECONDS + ${WARP_APT_BUDGET:-330}))
            local UNPACK_RESERVE=60
            local TRY CAP REM RC DOWNLOADED=false
            local APT_OPTS=(-o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=20 -o Dpkg::Use-Pty=0)

            # Ubuntu 鏡像（azure.archive.ubuntu.com）卡住時改用 archive.ubuntu.com（與 setup-plate-runner 相同的替換）。
            # runner 的來源是 mirror+file:/etc/apt/apt-mirrors.txt，只改清單檔內容，不動來源 URI，既有套件清單仍可用。可重複呼叫。
            # 11/11 晚間換鏡像後 archive.ubuntu.com 同樣每個檔案卡滿逾時（本機測兩個鏡像 IPv4／IPv6 皆正常），
            # 所以退路再加：之後的 apt 一律走 IPv4，並各用 5 秒量一次兩個位址族的連線，下次失敗時 log 就看得出卡在哪。
            local NET_OPTS=()
            use_fallback_ubuntu_mirror() {
              NET_OPTS=(-o Acquire::ForceIPv4=true)
              local MIRRORS="${WARP_APT_MIRRORS_FILE:-/etc/apt/apt-mirrors.txt}"
              if [ -f "$MIRRORS" ] && grep -q 'azure\.archive\.ubuntu\.com' "$MIRRORS"; then
                local FAM
                for FAM in 4 6; do
                  echo "probe IPv${FAM}: azure=$(curl -"$FAM" -s -o /dev/null -m 5 -w '%{http_code}/%{time_total}s' http://azure.archive.ubuntu.com/ubuntu/dists/ 2>/dev/null || true) archive=$(curl -"$FAM" -s -o /dev/null -m 5 -w '%{http_code}/%{time_total}s' https://archive.ubuntu.com/ubuntu/dists/ 2>/dev/null || true)"
                done
                sudo sed -i -E 's#https?://azure\.archive\.ubuntu\.com/ubuntu/?#https://archive.ubuntu.com/ubuntu/#g' "$MIRRORS" || true
                echo "::warning::Ubuntu apt mirror switched to archive.ubuntu.com (IPv4 only) for this run."
              fi
            }

            # update：第 1 輪用原鏡像（正常 3–17 秒）；卡住就換鏡像再完整更新一次；仍失敗則只更新 Cloudflare 來源、
            # Ubuntu 套件清單沿用 runner 映像內既有的（11/11 實測這樣仍能解出相依；清單過期時下載階段會明確失敗）。
            # 2026-11-15（WARP 審查 M1）：快取的 .deb 會以 root 安裝，而 main 上任何 job 都寫得進這份快取；
            # apt 對 archives 內現成的檔案只比對大小。所以不再整批複製：update 之後用 --print-uris 取得 apt
            # （已驗簽的索引）預期的檔名、再向 apt-cache 取 SHA256，逐檔比對相符才放進 archives；不符、查不到雜湊或不在清單內的
            # 一律不用，由 apt 自行下載。來自別的映像版本的快取（M2）也因此只會被略過，不會被誤用。
            local ARCHIVES="${WARP_APT_ARCHIVES:-/var/cache/apt/archives}"
            adopt_verified_cached_debs() {
              local CACHE_DIR="$HOME/.warp-apt-cache" URIS NAME SIZE HASH ALG HEX VER WANT ACTUAL OK=0 BAD=0 MISS=0
              local SPECS=() MD5_TO_SHA=""
              URIS=$(sudo timeout --signal=TERM --kill-after=10s 20s \
                       env DEBIAN_FRONTEND=noninteractive \
                       apt-get "${APT_OPTS[@]}" install -y --print-uris cloudflare-warp 2>/dev/null | grep "^'" || true)
              if [ -z "$URIS" ]; then
                echo "::warning::could not list the packages apt expects; cached .deb files are not used."
                return 0
              fi
              # apt 的 --print-uris 只印 MD5（實測 Ubuntu 26.04 的 apt 仍是 MD5Sum:），不拿它當驗證依據：
              # 用「套件=版本」向 apt-cache 取同一筆索引紀錄的 SHA256（以 MD5 只當作對應紀錄的鍵），再比對檔案的 SHA256。
              while read -r _ NAME SIZE HASH; do
                case "$NAME" in ''|*/*|.*) continue ;; esac
                [ -f "$CACHE_DIR/$NAME" ] || continue
                VER="${NAME#*_}"; VER="${VER%%_*}"; VER="${VER//%3a/:}"; VER="${VER//%3A/:}"
                SPECS+=("${NAME%%_*}=${VER}")
              done <<< "$URIS"
              if [ "${#SPECS[@]}" -gt 0 ]; then
                # 每行「md5 sha256」；不用關聯陣列（測試也在 bash 3.2 上跑）
                MD5_TO_SHA=$(timeout --signal=TERM --kill-after=10s 20s apt-cache show "${SPECS[@]}" 2>/dev/null | awk '
                  /^MD5sum: /  { md = $2 }
                  /^SHA256: /  { sha = $2 }
                  /^$/         { if (md != "" && sha != "") print md, sha; md = ""; sha = "" }
                  END          { if (md != "" && sha != "") print md, sha }' || true)
              fi
              while read -r _ NAME SIZE HASH; do
                case "$NAME" in ''|*/*|.*) continue ;; esac
                if [ ! -f "$CACHE_DIR/$NAME" ]; then MISS=$((MISS + 1)); continue; fi
                ALG="${HASH%%:*}"; HEX="${HASH#*:}"; WANT=""
                case "$ALG" in
                  SHA256) WANT="$HEX" ;;
                  MD5Sum) if [ -n "$HEX" ]; then WANT=$(awk -v m="$HEX" '$1 == m { print $2; exit }' <<< "$MD5_TO_SHA"); fi ;;
                esac
                ACTUAL=$(sha256sum "$CACHE_DIR/$NAME" | cut -d' ' -f1)
                if [ "${#WANT}" -eq 64 ] && [ "$ACTUAL" = "$WANT" ] && sudo cp "$CACHE_DIR/$NAME" "$ARCHIVES/"; then
                  OK=$((OK + 1))
                else
                  BAD=$((BAD + 1))
                fi
              done <<< "$URIS"
              echo "cached .deb: $OK verified (SHA256) and reused, $BAD rejected, $MISS not in cache (will be downloaded)."
              if [ "$BAD" -gt 0 ]; then echo "::warning::$BAD cached .deb file(s) failed SHA256 verification and were ignored."; fi
              return 0
            }

            # 2026-11-15（WARP 審查 H1）：只更新 Cloudflare 來源的那一輪原本只跑 1 次、上限 20 秒＝Acquire::https::Timeout，
            # apt 自己的重試來不及生效；11/13 那次失敗就是索引 0.6 秒抓完後卡 19.4 秒被砍。改成：
            #   上限 30 秒（大於 https Timeout，讓 apt 內建重試有機會跑）；有快取時失敗再試 2 輪（各 ≤40 秒、
            #   每輪重新建立連線、加 apt 的 https 除錯輸出）。沒有快取時前面已經用掉兩輪完整 update，Cloudflare-only 維持 1 輪。
            for TRY in 1 2 3 4 5; do
              # 已有快取的 .deb：跳過會碰 Ubuntu 鏡像的前兩輪，直接只更新 Cloudflare 來源
              if [ "${WARP_DEB_CACHE:-0}" = "1" ] && [ "$TRY" -lt 3 ]; then continue; fi
              REM=$((DEADLINE - SECONDS - UNPACK_RESERVE)); CAP=30
              local SCOPE=()
              if [ "$TRY" -eq 2 ]; then CAP=45; fi
              if [ "$TRY" -ge 3 ]; then
                SCOPE=(-o Dir::Etc::sourcelist=sources.list.d/cloudflare-client.list -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0)
                if [ "$TRY" -gt 3 ]; then CAP=40; SCOPE=(-o Debug::Acquire::https=true "${SCOPE[@]}"); fi
                if [ "${WARP_DEB_CACHE:-0}" != "1" ]; then
                  echo "::warning::falling back to Cloudflare-only apt index (Ubuntu lists from the runner image are reused)."
                fi
              fi
              if [ "$CAP" -gt "$REM" ]; then CAP=$REM; fi
              if [ "$CAP" -lt 10 ]; then echo "::warning::WARP install budget exhausted before apt-get update."; return 1; fi
              echo "apt-get update attempt $TRY (cap ${CAP}s)..."
              if sudo timeout --signal=TERM --kill-after=10s "${CAP}s" \
                   apt-get "${APT_OPTS[@]}" "${NET_OPTS[@]}" "${SCOPE[@]}" update; then
                break
              fi
              echo "::warning::apt-get update attempt $TRY failed or timed out."
              if [ "$TRY" -ge 5 ]; then return 1; fi
              if [ "$TRY" -ge 3 ]; then
                # Cloudflare-only 的重試只給快取模式
                if [ "${WARP_DEB_CACHE:-0}" != "1" ]; then return 1; fi
              else
                use_fallback_ubuntu_mirror
              fi
              sleep 3
            done

            if [ "${WARP_DEB_CACHE:-0}" = "1" ]; then adopt_verified_cached_debs; fi

            local FULL_UPDATED=false
            for TRY in 1 2 3; do
              REM=$((DEADLINE - SECONDS - UNPACK_RESERVE)); CAP=100
              if [ "$CAP" -gt "$REM" ]; then CAP=$REM; fi
              if [ "$CAP" -lt 10 ]; then echo "::warning::WARP install budget exhausted during download."; break; fi
              echo "apt-get install --download-only attempt $TRY/3 (cap ${CAP}s)..."
              RC=0
              sudo timeout --signal=TERM --kill-after=10s "${CAP}s" \
                   env DEBIAN_FRONTEND=noninteractive \
                   apt-get "${APT_OPTS[@]}" "${NET_OPTS[@]}" install -y --download-only cloudflare-warp || RC=$?
              if [ "$RC" -eq 0 ]; then
                DOWNLOADED=true
                break
              fi
              echo "::warning::download attempt $TRY failed or timed out (partial files are kept and resumed)."
              use_fallback_ubuntu_mirror
              # 2026-11-15（WARP 審查 M2）：快取模式只更新過 Cloudflare 來源，Ubuntu 清單是 runner 映像內的舊資料；
              # 下載失敗可能是清單過期（檔案已不在鏡像上）。補一次有上限的完整 update（只做一次、失敗不擋），成功後重新比對快取。
              # 只在 apt 自己回報錯誤時才做；被 timeout 砍掉（124／137＝連線卡住）時不做，把時間留給下載重試。
              if [ "${WARP_DEB_CACHE:-0}" = "1" ] && [ "$FULL_UPDATED" != "true" ] && [ "$RC" -ne 124 ] && [ "$RC" -ne 137 ]; then
                FULL_UPDATED=true
                REM=$((DEADLINE - SECONDS - UNPACK_RESERVE)); CAP=45
                if [ "$CAP" -gt "$REM" ]; then CAP=$REM; fi
                if [ "$CAP" -ge 10 ]; then
                  echo "full apt-get update after a failed download in cache mode (cap ${CAP}s)..."
                  if sudo timeout --signal=TERM --kill-after=10s "${CAP}s" \
                       apt-get "${APT_OPTS[@]}" "${NET_OPTS[@]}" update; then
                    adopt_verified_cached_debs
                  else
                    echo "::warning::full apt-get update failed or timed out; continuing with existing package lists."
                  fi
                fi
              fi
              sleep 2
            done
            if [ "$DOWNLOADED" != "true" ]; then return 1; fi

            for TRY in 1 2; do
              REM=$((DEADLINE - SECONDS)); CAP=120
              if [ "$CAP" -gt "$REM" ]; then CAP=$REM; fi
              if [ "$CAP" -lt 10 ]; then echo "::warning::WARP install budget exhausted before unpack."; return 1; fi
              echo "apt-get install (unpack from local .deb) attempt $TRY/2 (cap ${CAP}s)..."
              if sudo timeout --signal=TERM --kill-after=10s "${CAP}s" \
                   env DEBIAN_FRONTEND=noninteractive \
                   apt-get "${APT_OPTS[@]}" "${NET_OPTS[@]}" install -y cloudflare-warp; then
                return 0
              fi
              echo "::warning::unpack attempt $TRY failed or timed out; finishing any half-configured packages."
              # 最後一輪失敗後不必收尾（函式即將回傳失敗），省下最多 65 秒、不逼近步驟上限
              if [ "$TRY" -lt 2 ]; then sudo timeout --signal=TERM --kill-after=5s 60s dpkg --configure -a || true; fi
            done
            return 1
          }
          # 有快取的 .deb：update 直接只更新 Cloudflare 來源，不去碰 Ubuntu 鏡像；
          # 快取檔在函式內逐檔比對雜湊後才放進 apt 的 archives（見 adopt_verified_cached_debs）。
          WARP_DEB_CACHE=0
          if ls "$HOME/.warp-apt-cache/"*.deb >/dev/null 2>&1; then
            WARP_DEB_CACHE=1
            echo "Found $(ls "$HOME/.warp-apt-cache/"*.deb | wc -l) cached .deb packages; each is hash-verified before use."
          else
            echo "No cached .deb packages; everything will be downloaded."
          fi
          if ! install_warp_bounded; then
            echo "::error::Cloudflare WARP package installation failed or timed out after bounded retries (download/unpack two-phase)."
            exit 1
          fi

          # Register
          sudo warp-cli registration new --accept-tos 2>/dev/null || \
          sudo warp-cli --accept-tos registration new 2>/dev/null || true

          # Hardcode and Exclude Supabase IP from WARP
          SUB_DOMAIN=$(echo ${{ secrets.VITE_SUPABASE_URL }} | sed -E 's/https?:\/\/([^\/]+).*/\1/')
          SUB_IP=$(nslookup $SUB_DOMAIN | grep 'Address:' | tail -n1 | awk '{print $2}')
          if [ ! -z "$SUB_IP" ]; then
            echo "Hardcoding Supabase IP: $SUB_IP for $SUB_DOMAIN in /etc/hosts"
            echo "$SUB_IP $SUB_DOMAIN" | sudo tee -a /etc/hosts

            echo "Excluding Supabase IP: $SUB_IP from WARP"
            sudo warp-cli add-excluded-route $SUB_IP/32 2>/dev/null || \
            sudo warp-cli --accept-tos add-excluded-route $SUB_IP/32 2>/dev/null || true
          fi

          # Connect
          sudo warp-cli connect 2>/dev/null || \
          sudo warp-cli --accept-tos connect 2>/dev/null || true

          # Wait for connection to stabilize
          echo "Waiting for WARP connection..."
          sleep 15

          # Verify connection status
          sudo warp-cli status 2>/dev/null || \
          sudo warp-cli --accept-tos status 2>/dev/null || true

      - name: Verify IP and MVDIS Connectivity
        run: |
          echo "=== IP / WARP Check ==="
          CURRENT_IP=$(curl -s --max-time 15 ifconfig.me || echo "FAILED")
          echo "Current IP: $CURRENT_IP"

          COUNTRY=$(curl -s --max-time 10 "https://ipinfo.io/${CURRENT_IP}/country" 2>/dev/null | tr -d '[:space:]' || echo "UNKNOWN")
          echo "IP Country: $COUNTRY"
          if [ "$COUNTRY" = "TW" ]; then
            echo "WARP verified: IP is from Taiwan"
          else
            echo "WARNING: IP country is $COUNTRY (expected TW). MVDIS may block requests."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Run Announcements Sync
        run: node bid-announce-sync.cjs
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NODE_OPTIONS: '--dns-result-order=ipv4first'
