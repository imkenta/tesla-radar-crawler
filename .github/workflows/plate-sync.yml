name: Daily Plate Sync (Live) v2.1

on:
  # 20-minute cadence remains owned by the external workflow_dispatch scheduler.
  workflow_dispatch: {}

concurrency:
  group: plate-sync-workflow
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  shard-lane:
    name: shard-lane (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [NORTH, CENTRAL, SOUTH, SHARD4, SHARD5]
    uses: ./.github/workflows/plate-shard-lane.yml
    with:
      shard: ${{ matrix.shard }}
    secrets: inherit

  recovery-gate:
    name: verify-all-shards-complete
    needs: shard-lane
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enforce complete shard coverage
        shell: bash
        env:
          SHARD_LANES_RESULT: ${{ needs.shard-lane.result }}
        run: |
          if [ "$SHARD_LANES_RESULT" != "success" ]; then
            echo "::error::At least one shard lane failed primary and bounded fresh-runner recovery."
            exit 1
          fi
          echo "All five shard lanes completed within the bounded workflow window."

  finalize-sync:
    name: finalize-atomic-swap
    needs: recovery-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: success()
    concurrency:
      group: plate-sync-finalize
      cancel-in-progress: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Trigger Atomic Swap
        run: node trigger_swap.cjs
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          EMAIL_FROM_NAME: ${{ secrets.EMAIL_FROM_NAME }}
