name: Daily Plate Sync (Live) v2.1

on:
  # 20-minute cadence remains owned by the external workflow_dispatch scheduler.
  workflow_dispatch: {}

concurrency:
  group: plate-sync-workflow
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-plates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        shard: [NORTH, CENTRAL, SOUTH, SHARD4, SHARD5]
      fail-fast: false
    concurrency:
      group: plate-sync-shard-${{ matrix.shard }}
      cancel-in-progress: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup crawler runner
        uses: ./.github/actions/setup-plate-runner
        timeout-minutes: 15
        with:
          shards: ${{ matrix.shard }}
          supabase-url: ${{ secrets.VITE_SUPABASE_URL }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          gemini-api-key-north: ${{ secrets.GEMINI_API_KEY_NORTH }}
          gemini-api-key-central: ${{ secrets.GEMINI_API_KEY_CENTRAL }}
          gemini-api-key-south: ${{ secrets.GEMINI_API_KEY_SOUTH }}
          gemini-api-key-shard4: ${{ secrets.GEMINI_API_KEY_SHARD4 }}
          gemini-api-key-shard5: ${{ secrets.GEMINI_API_KEY_SHARD5 }}

      - name: Run Crawler Shard ${{ matrix.shard }} with local recovery
        id: crawl
        shell: bash
        run: bash scripts/run-plate-shard-with-recovery.sh "${{ matrix.shard }}"
        env:
          RESULT_PATH: ${{ runner.temp }}/plate-sync-result-${{ matrix.shard }}.json
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_NORTH: ${{ secrets.GEMINI_API_KEY_NORTH }}
          GEMINI_API_KEY_CENTRAL: ${{ secrets.GEMINI_API_KEY_CENTRAL }}
          GEMINI_API_KEY_SOUTH: ${{ secrets.GEMINI_API_KEY_SOUTH }}
          GEMINI_API_KEY_SHARD4: ${{ secrets.GEMINI_API_KEY_SHARD4 }}
          GEMINI_API_KEY_SHARD5: ${{ secrets.GEMINI_API_KEY_SHARD5 }}
          NODE_OPTIONS: '--dns-result-order=ipv4first'

      - name: Upload shard outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plate-sync-result-${{ matrix.shard }}
          path: ${{ runner.temp }}/plate-sync-result-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Enforce non-retryable crawler failure
        if: steps.crawl.outputs.status == 'HARD_FAILURE'
        shell: bash
        run: |
          echo "::error::${{ matrix.shard }} failed outside the retryable MVDIS preflight boundary."
          exit 1

  collect-results:
    needs: sync-plates
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      retry_matrix: ${{ steps.analyze.outputs.retry_matrix }}
      has_retries: ${{ steps.analyze.outputs.has_retries }}
      hard_failure: ${{ steps.analyze.outputs.hard_failure }}
      primary_result: ${{ steps.analyze.outputs.primary_result }}
    steps:
      - name: Download primary shard outcomes
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: plate-sync-result-*
          path: ${{ runner.temp }}/plate-sync-results
          merge-multiple: true

      - name: Classify primary shard outcomes
        id: analyze
        shell: bash
        env:
          PRIMARY_RESULT: ${{ needs.sync-plates.result }}
          RESULT_DIR: ${{ runner.temp }}/plate-sync-results
        run: |
          retry_shards=()
          hard_failure=false

          for shard in NORTH CENTRAL SOUTH SHARD4 SHARD5; do
            result_file="$RESULT_DIR/plate-sync-result-${shard}.json"
            if [ ! -f "$result_file" ]; then
              echo "::error::Missing primary outcome artifact for $shard."
              hard_failure=true
              continue
            fi

            artifact_shard=$(jq -r '.shard // ""' "$result_file")
            status=$(jq -r '.status // ""' "$result_file")
            if [ "$artifact_shard" != "$shard" ]; then
              echo "::error::Outcome artifact identity mismatch: expected $shard, got $artifact_shard."
              hard_failure=true
              continue
            fi
            case "$status" in
              SUCCESS)
                echo "$shard completed during the primary runner."
                ;;
              RETRY)
                echo "::warning::$shard requested a fresh-runner recovery."
                retry_shards+=("$shard")
                ;;
              HARD_FAILURE)
                echo "::error::$shard reported a non-retryable crawler failure."
                hard_failure=true
                ;;
              *)
                echo "::error::$shard produced an invalid outcome: $status"
                hard_failure=true
                ;;
            esac
          done

          retry_matrix=$(printf '%s\n' "${retry_shards[@]}" | jq -Rsc 'split("\n") | map(select(length > 0)) | {shard: .}')
          if [ "${#retry_shards[@]}" -gt 0 ]; then
            has_retries=true
          else
            has_retries=false
          fi

          echo "retry_matrix=$retry_matrix" >> "$GITHUB_OUTPUT"
          echo "has_retries=$has_retries" >> "$GITHUB_OUTPUT"
          echo "hard_failure=$hard_failure" >> "$GITHUB_OUTPUT"
          echo "primary_result=$PRIMARY_RESULT" >> "$GITHUB_OUTPUT"

  recovery-sync:
    needs: collect-results
    if: needs.collect-results.outputs.hard_failure == 'false' && needs.collect-results.outputs.has_retries == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.collect-results.outputs.retry_matrix) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup fresh recovery runner
        uses: ./.github/actions/setup-plate-runner
        timeout-minutes: 15
        with:
          shards: ${{ matrix.shard }}
          supabase-url: ${{ secrets.VITE_SUPABASE_URL }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          gemini-api-key-north: ${{ secrets.GEMINI_API_KEY_NORTH }}
          gemini-api-key-central: ${{ secrets.GEMINI_API_KEY_CENTRAL }}
          gemini-api-key-south: ${{ secrets.GEMINI_API_KEY_SOUTH }}
          gemini-api-key-shard4: ${{ secrets.GEMINI_API_KEY_SHARD4 }}
          gemini-api-key-shard5: ${{ secrets.GEMINI_API_KEY_SHARD5 }}

      - name: Retry Crawler Shard ${{ matrix.shard }} on fresh runner
        run: node gh-plate-sync.cjs --shard=${{ matrix.shard }}
        env:
          SKIP_SHARD_JITTER: '1'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_NORTH: ${{ secrets.GEMINI_API_KEY_NORTH }}
          GEMINI_API_KEY_CENTRAL: ${{ secrets.GEMINI_API_KEY_CENTRAL }}
          GEMINI_API_KEY_SOUTH: ${{ secrets.GEMINI_API_KEY_SOUTH }}
          GEMINI_API_KEY_SHARD4: ${{ secrets.GEMINI_API_KEY_SHARD4 }}
          GEMINI_API_KEY_SHARD5: ${{ secrets.GEMINI_API_KEY_SHARD5 }}
          NODE_OPTIONS: '--dns-result-order=ipv4first'

  recovery-gate:
    needs: [collect-results, recovery-sync]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enforce complete shard coverage
        shell: bash
        env:
          COLLECT_RESULT: ${{ needs.collect-results.result }}
          PRIMARY_RESULT: ${{ needs.collect-results.outputs.primary_result }}
          HARD_FAILURE: ${{ needs.collect-results.outputs.hard_failure }}
          HAS_RETRIES: ${{ needs.collect-results.outputs.has_retries }}
          RECOVERY_RESULT: ${{ needs.recovery-sync.result }}
        run: |
          if [ "$COLLECT_RESULT" != "success" ]; then
            echo "::error::Unable to classify all primary shard outcomes."
            exit 1
          fi
          if [ "$PRIMARY_RESULT" != "success" ] || [ "$HARD_FAILURE" = "true" ]; then
            echo "::error::At least one primary shard had a non-retryable or infrastructure failure."
            exit 1
          fi
          if [ "$HAS_RETRIES" = "true" ] && [ "$RECOVERY_RESULT" != "success" ]; then
            echo "::error::At least one fresh-runner shard recovery failed."
            exit 1
          fi
          echo "All five shards completed either on the primary runner or an approved fresh-runner recovery."

  finalize-sync:
    needs: recovery-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: success()
    concurrency:
      group: plate-sync-finalize
      cancel-in-progress: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Trigger Atomic Swap
        run: node trigger_swap.cjs
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          EMAIL_FROM_NAME: ${{ secrets.EMAIL_FROM_NAME }}
