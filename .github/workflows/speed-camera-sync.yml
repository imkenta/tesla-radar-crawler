name: Speed Camera Sync

# ⛔ 這不是正式同步路徑。正式同步＝維護者 Mac 的 launchd 每週一 10:00 跑
#    scripts/run-speed-camera-local.sh（台灣 IP），plist 副本在 scripts/launchd/，
#    操作與監看見 docs/speed-camera-local-schedule.md。
# ⛔ 不要手動觸發本 workflow 寫正式庫：美國 runner 被高雄網域地理封鎖、TGOS 回 403；
#    2026-09-26 實際觸發一次，freeway-npa 黃燈導致 national-npa 多寫 314 筆重複國道桿。
#    只保留作為「台灣 IP 環境失效時」的備案，使用前先確認上述來源可達。
on:
  # 僅 workflow_dispatch，不設 schedule（避免與本機排程雙源寫入；另見 2026-06-19
  # 雙源觸發連鎖取消事故政策，plate-sync.yml / bidding-plates-sync.yml 同一決議）。
  workflow_dispatch: {}

concurrency:
  group: speed-camera-sync
  cancel-in-progress: false

jobs:
  sync-speed-cameras:
    runs-on: ubuntu-latest
    # 正常只跑數分鐘（3 個開放資料來源下載+解析+upsert），15 分鐘上限足夠且能及早終結 hang。
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Run Speed Camera Sync (write mode)
        run: node speed-camera-sync.cjs --write
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NODE_OPTIONS: '--dns-result-order=ipv4first'
