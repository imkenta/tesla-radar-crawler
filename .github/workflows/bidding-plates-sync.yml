name: Bidding Plates Realtime Sync

on:
  # 2026-06-19: 移除 GitHub 內建 schedule，改由外部 cronjob（cron-job.org）經 workflow_dispatch 觸發。
  # 與 plate-sync 一致：避免 schedule + cronjob 雙源觸發同一 concurrency group 造成連鎖取消。
  workflow_dispatch: {}

concurrency:
  group: bidding-plates-sync-workflow
  cancel-in-progress: false

jobs:
  sync-bidding-plates:
    runs-on: ubuntu-latest
    # 防止單次 run 卡死霸佔 concurrency slot（GitHub 預設 360 分=6 小時）。
    # 正常只跑 1~2 分，設 10 分綽綽有餘。此 workflow 跑得快、每 10 分觸發不會重疊，故不需 guard。
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install and Configure Cloudflare WARP
        # 2026-11-10（健檢 O7）：步驟層上限（時間預算見下方安裝函式註解），卡住時在 job 的
        # 10 分鐘 timeout 之前明確失敗，而不是讓整個 job 被取消、爬完卻沒寫入（11/9 兩輪各卡 7.5 分鐘）。
        timeout-minutes: 7
        run: |
          # Import GPG key and add repository
          curl -fsSL --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 3 https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list

          # Install WARP。時間預算（步驟上限 7 分鐘；job 上限 10 分鐘不動，後面 npm ci＋爬取正常約 1–2 分鐘）：
          #   金鑰下載   正常 ~1 秒；最壞 3×30 秒＋重試間隔 ≈ 96 秒
          #   update     最多 2 輪，每輪上限 90 秒（＋TERM 後 15 秒強殺寬限），輪間睡 5 秒
          #   install    只跑 1 次，上限 240 秒（＋15 秒寬限）。Ubuntu 26.04 每次要下載 125 MB，
          #              實測綠燈輪次 install 約 66 秒、88 秒、2 分 54 秒；90 秒上限會砍掉原本會綠的輪次。
          #   正常慢速輪次  1 ＋ ~20 ＋ ~180 ≈ 3.5 分鐘 → 一定能綠
          #   update 卡一次再成功  1 ＋ 95 ＋ 5 ＋ ~20 ＋ ~180 ≈ 5.1 分鐘 → 仍能綠
          #   更糟的組合由 7 分鐘步驟上限把關（明確失敗，不再讓整個 job 被 10 分鐘 timeout 取消）。
          # install 不做第二輪：第二輪塞不進預算，而且 TERM 若落在 dpkg 解包階段，第二輪固定失敗於
          # 「dpkg was interrupted」。逾時／kill-after 與 Acquire::* 參數沿用
          # .github/actions/setup-plate-runner/action.yml 的 refresh_all_indexes／install_warp 寫法，
          # 但 update 上限是 90 秒、install 上限是 240 秒（與該檔 118／134 行一致）。
          install_warp_bounded() {
            local TRY
            for TRY in 1 2; do
              echo "apt-get update attempt $TRY/2..."
              if sudo timeout --signal=TERM --kill-after=15s 90s \
                   apt-get \
                     -o Acquire::Retries=2 \
                     -o Acquire::http::Timeout=15 \
                     -o Acquire::https::Timeout=20 \
                     -o Dpkg::Use-Pty=0 \
                     update; then
                break
              fi
              echo "::warning::apt-get update attempt $TRY failed or timed out."
              if [ "$TRY" -ge 2 ]; then return 1; fi
              sleep 5
            done
            echo "apt-get install cloudflare-warp (single attempt, 240s cap)..."
            sudo timeout --signal=TERM --kill-after=15s 240s \
              env DEBIAN_FRONTEND=noninteractive \
              apt-get \
                -o Acquire::Retries=2 \
                -o Acquire::http::Timeout=15 \
                -o Acquire::https::Timeout=20 \
                -o Dpkg::Use-Pty=0 \
                install -y cloudflare-warp
          }
          if ! install_warp_bounded; then
            echo "::error::Cloudflare WARP package installation failed or timed out after bounded retries."
            exit 1
          fi

          # Register
          sudo warp-cli registration new --accept-tos 2>/dev/null || \
          sudo warp-cli --accept-tos registration new 2>/dev/null || true

          # Hardcode and Exclude Supabase IP from WARP
          SUB_DOMAIN=$(echo ${{ secrets.VITE_SUPABASE_URL }} | sed -E 's/https?:\/\/([^\/]+).*/\1/')
          SUB_IP=$(nslookup $SUB_DOMAIN | grep 'Address:' | tail -n1 | awk '{print $2}')
          if [ ! -z "$SUB_IP" ]; then
            echo "Hardcoding Supabase IP: $SUB_IP for $SUB_DOMAIN in /etc/hosts"
            echo "$SUB_IP $SUB_DOMAIN" | sudo tee -a /etc/hosts

            echo "Excluding Supabase IP: $SUB_IP from WARP"
            sudo warp-cli add-excluded-route $SUB_IP/32 2>/dev/null || \
            sudo warp-cli --accept-tos add-excluded-route $SUB_IP/32 2>/dev/null || true
          fi

          # Connect
          sudo warp-cli connect 2>/dev/null || \
          sudo warp-cli --accept-tos connect 2>/dev/null || true

          # Wait for connection to stabilize
          echo "Waiting for WARP connection..."
          sleep 15

          # Verify connection status
          sudo warp-cli status 2>/dev/null || \
          sudo warp-cli --accept-tos status 2>/dev/null || true

      - name: Verify IP and MVDIS Connectivity
        run: |
          echo "=== IP / WARP Check ==="
          CURRENT_IP=$(curl -s --max-time 15 ifconfig.me || echo "FAILED")
          echo "Current IP: $CURRENT_IP"

          COUNTRY=$(curl -s --max-time 10 "https://ipinfo.io/${CURRENT_IP}/country" 2>/dev/null | tr -d '[:space:]' || echo "UNKNOWN")
          echo "IP Country: $COUNTRY"
          if [ "$COUNTRY" = "TW" ]; then
            echo "WARP verified: IP is from Taiwan"
          else
            echo "WARNING: IP country is $COUNTRY (expected TW). MVDIS may block requests."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Run Bidding Plates Sync
        run: node bidding-plates-sync.cjs
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          EMAIL_FROM_NAME: ${{ secrets.EMAIL_FROM_NAME }}
          NODE_OPTIONS: '--dns-result-order=ipv4first'
