name: Plate Shard Lane

on:
  workflow_call:
    inputs:
      shard:
        description: Plate crawler shard handled by this isolated lane.
        required: true
        type: string
    secrets:
      VITE_SUPABASE_URL:
        required: true
      SUPABASE_SERVICE_ROLE_KEY:
        required: true
      GEMINI_API_KEY:
        required: true
      GEMINI_API_KEY_NORTH:
        required: true
      GEMINI_API_KEY_CENTRAL:
        required: true
      GEMINI_API_KEY_SOUTH:
        required: true
      GEMINI_API_KEY_SHARD4:
        required: true
      GEMINI_API_KEY_SHARD5:
        required: true

permissions:
  contents: read
  actions: read

env:
  # lane 預算單一來源：primary 的 deadline 與備援機獨立接手時的推算都用它。
  LANE_BUDGET_SECONDS: '1140'

jobs:
  primary:
    name: primary-attempt (${{ inputs.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      status: ${{ steps.crawl.outputs.status }}
      deadline_epoch: ${{ steps.budget.outputs.deadline_epoch }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2026-08-31：1080→1140。lane 結束後只剩 verify(~15s)+finalize(~60s)，1140s
      # 預算下 workflow 最晚 ~T+20.4 收工；下一班 dispatch 最多排隊 ~30s（僅在
      # lane 用滿預算時發生，綠燈輪 T+13 就收），無連環取消風險——取消雪崩需要
      # 單輪 >>20 分鐘（8/30 事故是 38-52 分鐘）。多出的 60s 專救尖峰期差
      # 2-3 分鐘完賽的輪（8/31 NORTH 兩度如此）。
      - name: Start 19-minute shard lane budget
        id: budget
        shell: bash
        run: echo "deadline_epoch=$(( $(date +%s) + LANE_BUDGET_SECONDS ))" >> "$GITHUB_OUTPUT"

      - name: Setup primary crawler runner
        uses: ./.github/actions/setup-plate-runner
        timeout-minutes: 10
        with:
          shards: ${{ inputs.shard }}
          supabase-url: ${{ secrets.VITE_SUPABASE_URL }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          gemini-api-key-north: ${{ secrets.GEMINI_API_KEY_NORTH }}
          gemini-api-key-central: ${{ secrets.GEMINI_API_KEY_CENTRAL }}
          gemini-api-key-south: ${{ secrets.GEMINI_API_KEY_SOUTH }}
          gemini-api-key-shard4: ${{ secrets.GEMINI_API_KEY_SHARD4 }}
          gemini-api-key-shard5: ${{ secrets.GEMINI_API_KEY_SHARD5 }}

      - name: Run primary crawler once
        id: crawl
        shell: bash
        run: bash scripts/run-plate-shard-with-recovery.sh "${{ inputs.shard }}"
        env:
          RESULT_PATH: ${{ runner.temp }}/plate-sync-result-${{ inputs.shard }}.json
          DEADLINE_EPOCH: ${{ steps.budget.outputs.deadline_epoch }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_NORTH: ${{ secrets.GEMINI_API_KEY_NORTH }}
          GEMINI_API_KEY_CENTRAL: ${{ secrets.GEMINI_API_KEY_CENTRAL }}
          GEMINI_API_KEY_SOUTH: ${{ secrets.GEMINI_API_KEY_SOUTH }}
          GEMINI_API_KEY_SHARD4: ${{ secrets.GEMINI_API_KEY_SHARD4 }}
          GEMINI_API_KEY_SHARD5: ${{ secrets.GEMINI_API_KEY_SHARD5 }}
          NODE_OPTIONS: '--dns-result-order=ipv4first'

      # 熱備援與 primary 平行啟動、拿不到 needs outputs；result artifact（含
      # status 與 deadline_epoch）是它取得 primary 結局與 lane 預算的唯一管道。
      - name: Publish primary outcome for the hot spare
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plate-sync-result-${{ inputs.shard }}
          path: ${{ runner.temp }}/plate-sync-result-${{ inputs.shard }}.json
          retention-days: 1
          overwrite: true

      - name: Summarize primary crawler outcome
        if: always()
        shell: bash
        env:
          SHARD: ${{ inputs.shard }}
          CRAWL_STATUS: ${{ steps.crawl.outputs.status }}
        run: |
          status="${CRAWL_STATUS:-MISSING}"
          {
            echo "## Primary attempt: $SHARD"
            echo
            echo "- Outcome: \`$status\`"
            case "$status" in
              SUCCESS)
                echo "- The crawler and all configured stations completed during the primary runner."
                ;;
              RETRY)
                echo "- MVDIS preflight was transiently unreachable; this shard immediately moved to its isolated recovery runner."
                ;;
              HARD_FAILURE)
                echo "- The crawler hit a non-retryable failure; recovery is not allowed."
                ;;
              *)
                echo "- The primary outcome is missing or invalid; the shard lane will fail closed."
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce non-retryable primary failure
        if: steps.crawl.outputs.status == 'HARD_FAILURE'
        shell: bash
        run: |
          echo "::error::${{ inputs.shard }} failed outside the retryable MVDIS preflight boundary."
          exit 1

  # 2026-09-01 熱備援：與 primary 平行啟動（無 needs），setup＋暖身驗票先做完，
  # 等 primary 的 result artifact——RETRY 就立刻接棒（省掉舊 recovery 2.5 分鐘
  # setup 關鍵路徑），SUCCESS/HARD_FAILURE 就收工。swap 全有全無語義不動。
  recovery:
    name: recovery-attempt (${{ inputs.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 21
    # 2026-09-04：備援機每輪都跑，它自己的失敗（如 setup 逾時）不得把整個 reusable
    # workflow 染紅、連累已成功的 primary（9/3 22:23 五個 primary 全成功、四台備援
    # setup 逾時 → 完整資料被丟掉不 swap）。lane-gate 以 status 輸出為準，
    # primary RETRY 時 status 非 SUCCESS 仍 fail-closed，不會因此放行殘缺資料。
    continue-on-error: true
    outputs:
      status: ${{ steps.crawl.outputs.status }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2026-09-04：primary 若在開爬前死於 setup（apt 慢/逾時）不會留 artifact，備援機
      # 以自己的起跑時間推算同一份 lane 預算整個接手（兩者同輪同秒發車）。
      - name: Record spare start for standalone takeover budget
        id: spare_budget
        shell: bash
        run: echo "spare_start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Setup fresh recovery runner
        uses: ./.github/actions/setup-plate-runner
        # 5→8：備援機不在關鍵路徑上（primary 最快 T+3.5 分鐘才交棒），setup 慢一點
        # 只是晚接棒，比 5 分鐘直接死掉好。
        timeout-minutes: 8
        with:
          shards: ${{ inputs.shard }}
          supabase-url: ${{ secrets.VITE_SUPABASE_URL }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          gemini-api-key-north: ${{ secrets.GEMINI_API_KEY_NORTH }}
          gemini-api-key-central: ${{ secrets.GEMINI_API_KEY_CENTRAL }}
          gemini-api-key-south: ${{ secrets.GEMINI_API_KEY_SOUTH }}
          gemini-api-key-shard4: ${{ secrets.GEMINI_API_KEY_SHARD4 }}
          gemini-api-key-shard5: ${{ secrets.GEMINI_API_KEY_SHARD5 }}

      - name: Stand by warm and take over within lane budget
        id: crawl
        shell: bash
        run: bash scripts/run-plate-shard-with-recovery.sh "${{ inputs.shard }}" spare
        env:
          GH_TOKEN: ${{ github.token }}
          SPARE_START_EPOCH: ${{ steps.spare_budget.outputs.spare_start_epoch }}
          RESULT_PATH: ${{ runner.temp }}/plate-sync-spare-result-${{ inputs.shard }}.json
          INITIAL_DELAY_SECONDS: '0'
          # 2026-08-31：冷卻 15→8s。重抽本身要 15-20s，兩者疊加的實際間隔仍
          # ~25s+；每張廢票省 7s。
          RETRY_COOLDOWN_SECONDS: '8'
          # 2026-08-31：3→5→6。次數限制不該先於預算耗盡；deadline 與
          # wait_before_retry 已硬性框住總時長，08:23 SHARD5 五票用盡差一張。
          MAX_PREFLIGHT_ATTEMPTS: '6'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_NORTH: ${{ secrets.GEMINI_API_KEY_NORTH }}
          GEMINI_API_KEY_CENTRAL: ${{ secrets.GEMINI_API_KEY_CENTRAL }}
          GEMINI_API_KEY_SOUTH: ${{ secrets.GEMINI_API_KEY_SOUTH }}
          GEMINI_API_KEY_SHARD4: ${{ secrets.GEMINI_API_KEY_SHARD4 }}
          GEMINI_API_KEY_SHARD5: ${{ secrets.GEMINI_API_KEY_SHARD5 }}
          NODE_OPTIONS: '--dns-result-order=ipv4first'

  lane-gate:
    name: verify-shard-lane (${{ inputs.shard }})
    needs: [primary, recovery]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify shard lane outcome
        shell: bash
        env:
          SHARD: ${{ inputs.shard }}
          PRIMARY_RESULT: ${{ needs.primary.result }}
          PRIMARY_STATUS: ${{ needs.primary.outputs.status }}
          RECOVERY_RESULT: ${{ needs.recovery.result }}
          RECOVERY_STATUS: ${{ needs.recovery.outputs.status }}
        run: |
          if [ "$PRIMARY_RESULT" != "success" ]; then
            # 2026-09-04：primary 死於 setup（從未開爬，沒有任何 status）而健康的備援機
            # 整個接手成功 → 放行；primary 曾開爬（HARD_FAILURE 等必留 status）→ 維持判死。
            if [ -z "$PRIMARY_STATUS" ] && [ "$RECOVERY_STATUS" = "SUCCESS" ]; then
              echo "$SHARD primary died before crawling; the hot spare completed the whole shard."
              exit 0
            fi
            echo "::error::Primary runner infrastructure or non-retryable failure for $SHARD."
            exit 1
          fi

          case "$PRIMARY_STATUS" in
            SUCCESS)
              echo "$SHARD completed on its primary runner."
              ;;
            RETRY)
              if [ "$RECOVERY_RESULT" != "success" ] || [ "$RECOVERY_STATUS" != "SUCCESS" ]; then
                echo "::error::Fresh-runner recovery did not complete $SHARD within its lane budget."
                exit 1
              fi
              echo "$SHARD completed on its isolated recovery runner."
              ;;
            *)
              echo "::error::Missing or invalid primary status for $SHARD: ${PRIMARY_STATUS:-MISSING}."
              exit 1
              ;;
          esac
