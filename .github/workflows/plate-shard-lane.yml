name: Plate Shard Lane

on:
  workflow_call:
    inputs:
      shard:
        description: Plate crawler shard handled by this isolated lane.
        required: true
        type: string
    secrets:
      VITE_SUPABASE_URL:
        required: true
      SUPABASE_SERVICE_ROLE_KEY:
        required: true
      GEMINI_API_KEY:
        required: true
      GEMINI_API_KEY_NORTH:
        required: true
      GEMINI_API_KEY_CENTRAL:
        required: true
      GEMINI_API_KEY_SOUTH:
        required: true
      GEMINI_API_KEY_SHARD4:
        required: true
      GEMINI_API_KEY_SHARD5:
        required: true

permissions:
  contents: read

jobs:
  primary:
    name: primary-attempt (${{ inputs.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 19
    outputs:
      status: ${{ steps.crawl.outputs.status }}
      deadline_epoch: ${{ steps.budget.outputs.deadline_epoch }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Start 18-minute shard lane budget
        id: budget
        shell: bash
        run: echo "deadline_epoch=$(( $(date +%s) + 1080 ))" >> "$GITHUB_OUTPUT"

      - name: Setup primary crawler runner
        uses: ./.github/actions/setup-plate-runner
        timeout-minutes: 10
        with:
          shards: ${{ inputs.shard }}
          supabase-url: ${{ secrets.VITE_SUPABASE_URL }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          gemini-api-key-north: ${{ secrets.GEMINI_API_KEY_NORTH }}
          gemini-api-key-central: ${{ secrets.GEMINI_API_KEY_CENTRAL }}
          gemini-api-key-south: ${{ secrets.GEMINI_API_KEY_SOUTH }}
          gemini-api-key-shard4: ${{ secrets.GEMINI_API_KEY_SHARD4 }}
          gemini-api-key-shard5: ${{ secrets.GEMINI_API_KEY_SHARD5 }}

      - name: Run primary crawler once
        id: crawl
        shell: bash
        run: bash scripts/run-plate-shard-with-recovery.sh "${{ inputs.shard }}"
        env:
          RESULT_PATH: ${{ runner.temp }}/plate-sync-result-${{ inputs.shard }}.json
          DEADLINE_EPOCH: ${{ steps.budget.outputs.deadline_epoch }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_NORTH: ${{ secrets.GEMINI_API_KEY_NORTH }}
          GEMINI_API_KEY_CENTRAL: ${{ secrets.GEMINI_API_KEY_CENTRAL }}
          GEMINI_API_KEY_SOUTH: ${{ secrets.GEMINI_API_KEY_SOUTH }}
          GEMINI_API_KEY_SHARD4: ${{ secrets.GEMINI_API_KEY_SHARD4 }}
          GEMINI_API_KEY_SHARD5: ${{ secrets.GEMINI_API_KEY_SHARD5 }}
          NODE_OPTIONS: '--dns-result-order=ipv4first'

      - name: Summarize primary crawler outcome
        if: always()
        shell: bash
        env:
          SHARD: ${{ inputs.shard }}
          CRAWL_STATUS: ${{ steps.crawl.outputs.status }}
        run: |
          status="${CRAWL_STATUS:-MISSING}"
          {
            echo "## Primary attempt: $SHARD"
            echo
            echo "- Outcome: \`$status\`"
            case "$status" in
              SUCCESS)
                echo "- The crawler and all configured stations completed during the primary runner."
                ;;
              RETRY)
                echo "- MVDIS preflight was transiently unreachable; this shard immediately moved to its isolated recovery runner."
                ;;
              HARD_FAILURE)
                echo "- The crawler hit a non-retryable failure; recovery is not allowed."
                ;;
              *)
                echo "- The primary outcome is missing or invalid; the shard lane will fail closed."
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce non-retryable primary failure
        if: steps.crawl.outputs.status == 'HARD_FAILURE'
        shell: bash
        run: |
          echo "::error::${{ inputs.shard }} failed outside the retryable MVDIS preflight boundary."
          exit 1

  recovery:
    name: recovery-attempt (${{ inputs.shard }})
    needs: primary
    if: needs.primary.outputs.status == 'RETRY'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    outputs:
      status: ${{ steps.crawl.outputs.status }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Require enough lane budget for recovery
        shell: bash
        env:
          DEADLINE_EPOCH: ${{ needs.primary.outputs.deadline_epoch }}
        run: |
          remaining_seconds=$((DEADLINE_EPOCH - $(date +%s)))
          if [ "$remaining_seconds" -lt 600 ]; then
            echo "::error::Only ${remaining_seconds}s remain; refusing to start a recovery that would delay the next 20-minute schedule."
            exit 1
          fi
          echo "Starting isolated recovery with ${remaining_seconds}s remaining in the shard lane budget."

      - name: Setup fresh recovery runner
        uses: ./.github/actions/setup-plate-runner
        timeout-minutes: 5
        with:
          shards: ${{ inputs.shard }}
          supabase-url: ${{ secrets.VITE_SUPABASE_URL }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          gemini-api-key-north: ${{ secrets.GEMINI_API_KEY_NORTH }}
          gemini-api-key-central: ${{ secrets.GEMINI_API_KEY_CENTRAL }}
          gemini-api-key-south: ${{ secrets.GEMINI_API_KEY_SOUTH }}
          gemini-api-key-shard4: ${{ secrets.GEMINI_API_KEY_SHARD4 }}
          gemini-api-key-shard5: ${{ secrets.GEMINI_API_KEY_SHARD5 }}

      - name: Retry crawler on fresh runner within lane budget
        id: crawl
        shell: bash
        run: bash scripts/run-plate-shard-with-recovery.sh "${{ inputs.shard }}" fresh
        env:
          RESULT_PATH: ${{ runner.temp }}/plate-sync-result-${{ inputs.shard }}.json
          DEADLINE_EPOCH: ${{ needs.primary.outputs.deadline_epoch }}
          INITIAL_DELAY_SECONDS: '0'
          RETRY_COOLDOWN_SECONDS: '15'
          MAX_PREFLIGHT_ATTEMPTS: '3'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_NORTH: ${{ secrets.GEMINI_API_KEY_NORTH }}
          GEMINI_API_KEY_CENTRAL: ${{ secrets.GEMINI_API_KEY_CENTRAL }}
          GEMINI_API_KEY_SOUTH: ${{ secrets.GEMINI_API_KEY_SOUTH }}
          GEMINI_API_KEY_SHARD4: ${{ secrets.GEMINI_API_KEY_SHARD4 }}
          GEMINI_API_KEY_SHARD5: ${{ secrets.GEMINI_API_KEY_SHARD5 }}
          NODE_OPTIONS: '--dns-result-order=ipv4first'

  lane-gate:
    name: verify-shard-lane (${{ inputs.shard }})
    needs: [primary, recovery]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify shard lane outcome
        shell: bash
        env:
          SHARD: ${{ inputs.shard }}
          PRIMARY_RESULT: ${{ needs.primary.result }}
          PRIMARY_STATUS: ${{ needs.primary.outputs.status }}
          RECOVERY_RESULT: ${{ needs.recovery.result }}
          RECOVERY_STATUS: ${{ needs.recovery.outputs.status }}
        run: |
          if [ "$PRIMARY_RESULT" != "success" ]; then
            echo "::error::Primary runner infrastructure or non-retryable failure for $SHARD."
            exit 1
          fi

          case "$PRIMARY_STATUS" in
            SUCCESS)
              echo "$SHARD completed on its primary runner."
              ;;
            RETRY)
              if [ "$RECOVERY_RESULT" != "success" ] || [ "$RECOVERY_STATUS" != "SUCCESS" ]; then
                echo "::error::Fresh-runner recovery did not complete $SHARD within its lane budget."
                exit 1
              fi
              echo "$SHARD completed on its isolated recovery runner."
              ;;
            *)
              echo "::error::Missing or invalid primary status for $SHARD: ${PRIMARY_STATUS:-MISSING}."
              exit 1
              ;;
          esac
