name: Setup Plate Runner
description: Install the crawler runtime, configure WARP, and verify external dependencies.

inputs:
  shards:
    description: One shard or a comma-separated shard list whose Gemini keys must be verified.
    required: true
  supabase-url:
    description: Supabase project URL used for split-tunnel routing and connectivity checks.
    required: true
  gemini-api-key:
    description: Default Gemini API key.
    required: true
  gemini-api-key-north:
    description: NORTH Gemini API key.
    required: true
  gemini-api-key-central:
    description: CENTRAL Gemini API key.
    required: true
  gemini-api-key-south:
    description: SOUTH Gemini API key.
    required: true
  gemini-api-key-shard4:
    description: SHARD4 Gemini API key.
    required: true
  gemini-api-key-shard5:
    description: SHARD5 Gemini API key.
    required: true

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '20'

    # 2026-09-10：Puppeteer 的 postinstall 會下載 Chrome headless shell，撞到
    # ECONNRESET 就整個 npm ci 失敗、primary 在 11 秒內死於 setup（9/9 19:03 SHARD5）。
    # 快取瀏覽器讓命中時完全不必下載。
    - name: Cache Puppeteer browsers
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/puppeteer
        key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          puppeteer-${{ runner.os }}-

    - name: Install Dependencies
      shell: bash
      # npm ci 本身無重試；瞬斷不該讓整條 lane 陣亡。
      run: |
        for attempt in 1 2 3; do
          if npm ci; then exit 0; fi
          echo "::warning::npm ci attempt $attempt/3 failed."
          if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
        done
        echo "::error::npm ci failed after 3 attempts."
        exit 1

    # 2026-11-16（WARP 審查 M1b）：這份快取的 .deb 會以 root 安裝，而 main 上任何 job 都寫得進 warp-apt-* 快取；
    # 握有 Gemini／Supabase 金鑰的車牌同步不能直接信任它。所以：
    #   1. 只還原（actions/cache/restore），不再用整合版 actions/cache 在 job 結束時原樣存回。
    #   2. 安裝步驟逐檔比對 apt 索引的 SHA256 才採用快取檔（見下方 install_warp_verified）。
    #   3. 安裝後快取目錄只留這一輪 apt archives 內的檔（全部經 apt 或上面的比對驗過），
    #      以「映像版本＋檔名清單雜湊＋run 編號」為鍵另存；還原進來的已是同一組檔就不存（判斷在安裝步驟內）。
    # ⚠️ 這只管 .deb 這條路。actions/cache 還原本身以 tar -P 解壓（M1c）、Puppeteer 快取裡的瀏覽器也是直接執行，
    #    同一個威脅模型下仍是未關的洞（見 health-check 的 warp-review 文件）。Cloudflare 出新版 WARP 時檔名改變 → 自動存新鍵，
    #      下一輪起又是零下載。競標兩支 workflow 用 restore-keys 取同映像最新的一份。
    - name: Detect runner image version
      id: runner-image
      shell: bash
      run: echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

    - name: Restore cached Cloudflare WARP apt packages
      id: cache-warp-apt
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.warp-apt-cache
        # 主鍵刻意不會命中（每輪唯一、也不會被存下），一律由 restore-keys 取最新一份：先同映像版本，再任何版本。
        key: warp-apt-${{ runner.os }}-${{ steps.runner-image.outputs.version }}-lookup-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          warp-apt-${{ runner.os }}-${{ steps.runner-image.outputs.version }}-
          warp-apt-${{ runner.os }}-

    - name: Install and Configure Cloudflare WARP
      id: install-warp
      shell: bash
      env:
        SUPABASE_URL: ${{ inputs.supabase-url }}
        WARP_CACHE_MATCHED_KEY: ${{ steps.cache-warp-apt.outputs.cache-matched-key }}
      run: |
        curl -fsSL --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 3 \
          https://pkg.cloudflareclient.com/pubkey.gpg \
          | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
        echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list

        for SOURCE_FILE in \
          /etc/apt/apt-mirrors.txt \
          /etc/apt/sources.list \
          /etc/apt/sources.list.d/ubuntu.sources; do
          if [ -f "$SOURCE_FILE" ]; then
            sudo sed -i -E \
              's#https?://azure\.archive\.ubuntu\.com/ubuntu/?#https://archive.ubuntu.com/ubuntu/#g' \
              "$SOURCE_FILE"
          fi
        done

        echo 'APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99keep-debs > /dev/null

        # 安裝流程（2026-11-16 起）：
        #   1. 只更新 Cloudflare 單一來源的索引（最多 3 輪 30／40／40 秒；不碰 Ubuntu 鏡像，
        #      Ubuntu 套件清單沿用 runner 映像內建的——9/3–9/4 Ubuntu 鏡像的 update 慢到 90 秒×2 逾時，所以平常不刷）。
        #   2. 有快取時逐檔比對 SHA256，相符才放進 apt archives（adopt_verified_cached_debs，與競標 workflow 逐字相同）。
        #   3. 按名稱安裝 cloudflare-warp。快取齊全時「Need to get 0 B」，不連 Ubuntu 鏡像。
        #      ⛔ 不得再用本地路徑安裝快取裡的 .deb（apt 對本地檔完全不驗雜湊），也不得整批複製快取檔。
        #   4. 上面任一步失敗（Cloudflare 索引抓不到；或映像內建清單指向已下架的相依版本而 404，9/23 實例）
        #      → 有上限的完整 apt-get update（含 Ubuntu 鏡像）後，重新比對快取、重裝一次。
        # 版本：一律裝 Cloudflare 索引的現行版（索引只保留最新一版，舊版 .deb 無從驗證）。
        # >>> warp-apt-lib: adopt_verified_cached_debs（由 .github/scripts/warp-apt-lib.sh 產生，勿手改；改 lib 後跑 npm run sync:warp-lib）
        adopt_verified_cached_debs() {
          local CACHE_DIR="$HOME/.warp-apt-cache" URIS NAME SIZE HASH ALG HEX VER WANT ACTUAL OK=0 BAD=0 MISS=0
          local SPECS=() MD5_TO_SHA=""
          URIS=$(sudo timeout --signal=TERM --kill-after=10s 20s \
                   env DEBIAN_FRONTEND=noninteractive \
                   apt-get "${APT_OPTS[@]}" install -y --print-uris cloudflare-warp 2>/dev/null | grep "^'" || true)
          if [ -z "$URIS" ]; then
            echo "::warning::could not list the packages apt expects; cached .deb files are not used."
            return 0
          fi
          # apt 的 --print-uris 只印 MD5（實測 Ubuntu 26.04 的 apt 仍是 MD5Sum:），不拿它當驗證依據：
          # 用「套件=版本」向 apt-cache 取同一筆索引紀錄的 SHA256（以 MD5 只當作對應紀錄的鍵），再比對檔案的 SHA256。
          while read -r _ NAME SIZE HASH; do
            case "$NAME" in ''|*/*|.*) continue ;; esac
            [ -f "$CACHE_DIR/$NAME" ] || continue
            VER="${NAME#*_}"; VER="${VER%%_*}"; VER="${VER//%3a/:}"; VER="${VER//%3A/:}"
            SPECS+=("${NAME%%_*}=${VER}")
          done <<< "$URIS"
          if [ "${#SPECS[@]}" -gt 0 ]; then
            # 每行「md5 sha256」；不用關聯陣列（測試也在 bash 3.2 上跑）
            MD5_TO_SHA=$(timeout --signal=TERM --kill-after=10s 20s apt-cache show "${SPECS[@]}" 2>/dev/null | awk '
              /^MD5sum: /  { md = $2 }
              /^SHA256: /  { sha = $2 }
              /^$/         { if (md != "" && sha != "") print md, sha; md = ""; sha = "" }
              END          { if (md != "" && sha != "") print md, sha }' || true)
          fi
          while read -r _ NAME SIZE HASH; do
            case "$NAME" in ''|*/*|.*) continue ;; esac
            if [ ! -f "$CACHE_DIR/$NAME" ]; then MISS=$((MISS + 1)); continue; fi
            ALG="${HASH%%:*}"; HEX="${HASH#*:}"; WANT=""
            case "$ALG" in
              SHA256) WANT="$HEX" ;;
              MD5Sum) if [ -n "$HEX" ]; then WANT=$(awk -v m="$HEX" '$1 == m { print $2; exit }' <<< "$MD5_TO_SHA"); fi ;;
            esac
            ACTUAL=$(sha256sum "$CACHE_DIR/$NAME" | cut -d' ' -f1)
            if [ "${#WANT}" -eq 64 ] && [ "$ACTUAL" = "$WANT" ] && sudo cp "$CACHE_DIR/$NAME" "$ARCHIVES/"; then
              OK=$((OK + 1))
            else
              BAD=$((BAD + 1))
            fi
          done <<< "$URIS"
          echo "cached .deb: $OK verified (SHA256) and reused, $BAD rejected, $MISS not in cache (will be downloaded)."
          if [ "$BAD" -gt 0 ]; then echo "::warning::$BAD cached .deb file(s) failed SHA256 verification and were ignored."; fi
          return 0
        }
        # <<< warp-apt-lib: adopt_verified_cached_debs
        # >>> warp-apt-lib: install_warp_verified（由 .github/scripts/warp-apt-lib.sh 產生，勿手改；改 lib 後跑 npm run sync:warp-lib）
        install_warp_verified() {
          local APT_OPTS=(-o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=20 -o Dpkg::Use-Pty=0)
          local ARCHIVES="${WARP_APT_ARCHIVES:-/var/cache/apt/archives}"
          local CACHE_DIR="$HOME/.warp-apt-cache" HAVE_CACHE=false INSTALLED=false REJECTED=false TRY CAP BASE_KEY PRE_LIST="" POST_LIST
          local ADOPT_LOG="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/warp-adopt.$$.log"

          cloudflare_only_update() {
            for TRY in 1 2 3; do
              CAP=30
              local DEBUG_OPTS=()
              if [ "$TRY" -gt 1 ]; then CAP=40; DEBUG_OPTS=(-o Debug::Acquire::https=true); fi
              echo "apt-get update (Cloudflare repo only) attempt $TRY/3 (cap ${CAP}s)..."
              if sudo timeout --signal=TERM --kill-after=10s "${CAP}s" \
                apt-get "${APT_OPTS[@]}" "${DEBUG_OPTS[@]}" \
                  -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/cloudflare-client.list \
                  -o Dir::Etc::sourceparts=- \
                  -o APT::Get::List-Cleanup=0 \
                  update; then
                return 0
              fi
              echo "::warning::apt-get update (Cloudflare repo only) attempt $TRY failed or timed out."
              if [ "$TRY" -lt 3 ]; then sleep 3; fi
            done
            return 1
          }

          refresh_all_indexes() {
            for TRY in 1 2; do
              echo "apt-get update (all sources, fallback) attempt $TRY/2..."
              if sudo timeout --signal=TERM --kill-after=15s 90s \
                apt-get "${APT_OPTS[@]}" update; then
                return 0
              fi
              echo "::warning::Full apt-get update attempt $TRY failed or timed out."
              if [ "$TRY" -lt 2 ]; then sleep 5; fi
            done
            return 1
          }

          install_warp() {
            sudo timeout --signal=TERM --kill-after=15s 240s \
              env DEBIAN_FRONTEND=noninteractive \
              apt-get "${APT_OPTS[@]}" install -y cloudflare-warp
          }

          if ls "$CACHE_DIR"/*.deb > /dev/null 2>&1; then HAVE_CACHE=true; fi
          if [ -d "$CACHE_DIR" ]; then PRE_LIST=$(ls -A "$CACHE_DIR" | LC_ALL=C sort | sha256sum | cut -c1-32); fi

          if cloudflare_only_update; then
            if [ "$HAVE_CACHE" = "true" ]; then adopt_verified_cached_debs | tee -a "$ADOPT_LOG"; fi
            if install_warp; then
              INSTALLED=true
            else
              echo "::warning::Cloudflare WARP installation failed; refreshing all apt indexes and retrying."
            fi
          else
            echo "::warning::Cloudflare-only apt index update failed; refreshing all apt indexes and retrying."
          fi

          if [ "$INSTALLED" != "true" ]; then
            if ! refresh_all_indexes; then
              echo "::error::Unable to refresh apt indexes after bounded retries."
              return 1
            fi
            if [ "$HAVE_CACHE" = "true" ]; then adopt_verified_cached_debs | tee -a "$ADOPT_LOG"; fi
            if ! install_warp; then
              echo "::error::Cloudflare WARP package installation failed or timed out."
              return 1
            fi
          fi

          # 快取目錄整個重建，只放這一輪 apt archives 內的一般檔（全部經 apt 或上面的比對驗過）：
          # 還原進來但沒通過比對、已不在清單內、或根本不是 .deb 的東西（目錄、symlink、雜檔）都不再存回去。
          rm -rf -- "$HOME/.warp-apt-cache"
          mkdir -p "$CACHE_DIR"
          local DEB
          for DEB in "$ARCHIVES"/*.deb; do
            if [ -f "$DEB" ] && [ ! -L "$DEB" ]; then sudo cp "$DEB" "$CACHE_DIR/" || true; fi
          done
          sudo chown -R "$(id -u):$(id -g)" "$CACHE_DIR"
          # 另存的鍵（空字串＝不存）。鍵一律帶 run 編號：restore-keys 取的是同前綴下「最新」的一份，
          # 用固定鍵的話，只要那個鍵早就存在就存不進去，壞掉的那份會一直是最新的。
          #   不存：還原命中的鍵屬於同一組檔名，而且還原進來的目錄內容（檔名清單）與重建後完全相同。
          #   要存：其餘情況；以及有快取檔雜湊不符（檔名相同、內容被換掉或損毀）。
          #         後者只在同時有檔通過比對時才算數——全部都驗不過多半是索引查不到雜湊，每輪另存只會洗掉快取額度。
          WARP_CACHE_KEY=""
          POST_LIST=$(ls -A "$CACHE_DIR" | LC_ALL=C sort | sha256sum | cut -c1-32)
          if grep -q 'failed SHA256 verification' "$ADOPT_LOG" 2>/dev/null \
             && grep -Eq 'cached \.deb: [1-9][0-9]* verified' "$ADOPT_LOG" 2>/dev/null; then REJECTED=true; fi
          rm -f "$ADOPT_LOG"
          if ls "$CACHE_DIR"/*.deb > /dev/null 2>&1; then
            BASE_KEY="warp-apt-${RUNNER_OS:-Linux}-${ImageVersion:-unknown}-debs-${POST_LIST}"
            if [ "$REJECTED" = "true" ] || [ "$PRE_LIST" != "$POST_LIST" ] || [[ "${WARP_CACHE_MATCHED_KEY:-}" != "$BASE_KEY"* ]]; then
              WARP_CACHE_KEY="${BASE_KEY}-r${GITHUB_RUN_ID:-0}-${GITHUB_RUN_ATTEMPT:-0}"
            fi
          fi
          return 0
        }
        # <<< warp-apt-lib: install_warp_verified

        if ! install_warp_verified; then exit 1; fi
        echo "cache-key=$WARP_CACHE_KEY" >> "$GITHUB_OUTPUT"

        sudo warp-cli registration new --accept-tos 2>/dev/null || \
        sudo warp-cli --accept-tos registration new 2>/dev/null || true

        # 2026-11-10（健檢 O2）：直連出口 IP 金絲雀原本是單次 `curl api.ipify.org`（--max-time 15）。
        # 11/8 15:23 ipify 一次逾時，7 個 job（primary 與 recovery 同時）在 80 秒內死在 setup。
        # 改成有上限的重試＋備援端點；回傳值必須像 IPv4，否則視為失敗（避免空字串 == 空字串 讓金絲雀假通過）。
        # 兩個端點都必須在 WARP 的 `tunnel host add` 排除清單內（見下方 HOST 迴圈），
        # 這樣 WARP 開啟後不論哪個端點回答，看到的都是 GitHub 直連 IP，split-tunnel 判定語意不變。
        # 用法：fetch_direct_ipv4 [偏好端點]，成功時輸出「<端點> <IPv4>」。AFTER 傳入 BEFORE 回答的端點，
        # 優先問同一個服務（不同服務看到的 IP 理論上相同，但同端點比對最不容易誤判）。
        # 注意：迴圈變數刻意不叫 ATTEMPT（Gemini 預檢步驟用它，測試的假 curl 也靠它分辨呼叫）。
        fetch_direct_ipv4() {
          local TRY ENDPOINT RESULT
          local ENDPOINTS=(https://api.ipify.org https://checkip.amazonaws.com)
          if [ "${1:-}" = "https://checkip.amazonaws.com" ]; then
            ENDPOINTS=(https://checkip.amazonaws.com https://api.ipify.org)
          fi
          for TRY in 1 2 3; do
            for ENDPOINT in "${ENDPOINTS[@]}"; do
              RESULT=$(curl -4 -fsS --max-time 15 "$ENDPOINT" 2>/dev/null || true)
              RESULT=${RESULT//[[:space:]]/}
              if [[ "$RESULT" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
                echo "$ENDPOINT $RESULT"
                return 0
              fi
              echo "::warning::Direct IPv4 lookup via $ENDPOINT failed (round $TRY/3)." >&2
            done
            if [ "$TRY" -lt 3 ]; then sleep $((TRY * 3)); fi
          done
          return 1
        }

        if ! BEFORE_RESULT=$(fetch_direct_ipv4); then
          echo "::error::Unable to determine the GitHub direct IPv4 before WARP after bounded retries."
          exit 1
        fi
        BEFORE_ENDPOINT=${BEFORE_RESULT% *}
        DIRECT_IP_BEFORE=${BEFORE_RESULT#* }
        echo "GitHub direct IPv4 before WARP: $DIRECT_IP_BEFORE"

        for HOST in generativelanguage.googleapis.com api.ipify.org; do
          if sudo warp-cli tunnel host add "$HOST" 2>/dev/null || \
             sudo warp-cli --accept-tos tunnel host add "$HOST" 2>/dev/null; then
            echo "Excluded from WARP: $HOST"
          else
            echo "::error::Failed to exclude $HOST from WARP; refusing an unverified Gemini route."
            exit 1
          fi
        done

        # 備援金絲雀端點（fetch_direct_ipv4 的第二順位）也要排除在 WARP 之外，WARP 開啟後它回的才是直連 IP。
        # 這一個排除失敗只警告、不中止：若它沒排除成功，WARP 後經它查到的會是 WARP IP → 與 BEFORE 不符 →
        # 下方金絲雀照樣 fail-closed，不會放行；不該因為「備援」本身讓原本能過的 lane 死在 setup。
        if sudo warp-cli tunnel host add checkip.amazonaws.com 2>/dev/null || \
           sudo warp-cli --accept-tos tunnel host add checkip.amazonaws.com 2>/dev/null; then
          echo "Excluded from WARP: checkip.amazonaws.com (backup canary endpoint)"
        else
          echo "::warning::Failed to exclude backup canary endpoint checkip.amazonaws.com from WARP; canary stays fail-closed."
        fi

        SUB_DOMAIN=$(sed -E 's#https?://([^/]+).*#\1#' <<< "$SUPABASE_URL")
        SUB_IP=$(getent ahostsv4 "$SUB_DOMAIN" 2>/dev/null | awk 'NR == 1 { print $1 }')
        if [ -n "$SUB_IP" ]; then
          echo "$SUB_IP $SUB_DOMAIN" | sudo tee -a /etc/hosts
          sudo warp-cli add-excluded-route "$SUB_IP/32" 2>/dev/null || \
          sudo warp-cli --accept-tos add-excluded-route "$SUB_IP/32" 2>/dev/null || true
        fi

        sudo warp-cli connect 2>/dev/null || \
        sudo warp-cli --accept-tos connect 2>/dev/null || true

        echo "Waiting for WARP connection..."
        WARP_TRACE=""
        for WARP_WAIT in 1 2 3 4 5 6; do
          sleep 5
          WARP_TRACE=$(curl -4 -fsS --max-time 15 https://www.cloudflare.com/cdn-cgi/trace 2>/dev/null || true)
          if grep -q '^warp=on$' <<< "$WARP_TRACE"; then
            echo "WARP confirmed on after $((WARP_WAIT * 5))s."
            break
          fi
        done
        sudo warp-cli status 2>/dev/null || \
        sudo warp-cli --accept-tos status 2>/dev/null || true

        if ! grep -q '^warp=on$' <<< "$WARP_TRACE"; then
          echo "::error::Cloudflare trace did not confirm warp=on."
          echo "$WARP_TRACE"
          exit 1
        fi

        if ! AFTER_RESULT=$(fetch_direct_ipv4 "$BEFORE_ENDPOINT"); then
          echo "::error::Unable to determine the GitHub direct IPv4 after WARP exclusion; split-tunnel canary unproven."
          exit 1
        fi
        AFTER_ENDPOINT=${AFTER_RESULT% *}
        DIRECT_IP_AFTER=${AFTER_RESULT#* }
        if [ "$AFTER_ENDPOINT" != "$BEFORE_ENDPOINT" ]; then
          echo "::warning::Canary compares across endpoints (before: $BEFORE_ENDPOINT, after: $AFTER_ENDPOINT); the preferred endpoint was unreachable."
        fi
        echo "GitHub direct IPv4 after WARP exclusion: $DIRECT_IP_AFTER"
        if [ "$DIRECT_IP_AFTER" != "$DIRECT_IP_BEFORE" ]; then
          echo "::error::Split-tunnel canary changed IP; Gemini bypass is not proven."
          exit 1
        fi

    - name: Save verified Cloudflare WARP apt packages
      if: steps.install-warp.outputs.cache-key != ''
      continue-on-error: true
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.warp-apt-cache
        key: ${{ steps.install-warp.outputs.cache-key }}

    - name: Verify IP and MVDIS Connectivity
      shell: bash
      env:
        SUPABASE_URL: ${{ inputs.supabase-url }}
      run: |
        echo "=== IPv4 / WARP Check ==="
        WARP_TRACE=$(curl -4 -fsS --max-time 15 https://www.cloudflare.com/cdn-cgi/trace)
        CURRENT_IP=$(awk -F= '$1 == "ip" { print $2 }' <<< "$WARP_TRACE")
        COUNTRY=$(awk -F= '$1 == "loc" { print $2 }' <<< "$WARP_TRACE")
        echo "Current IPv4: ${CURRENT_IP:-UNKNOWN}"
        echo "Cloudflare location: ${COUNTRY:-UNKNOWN}"
        if [ "$COUNTRY" != "TW" ]; then
          echo "::warning::WARP location is ${COUNTRY:-UNKNOWN}; Chromium MVDIS preflight remains authoritative."
        fi

        echo "=== Advisory MVDIS shell probe ==="
        set +e
        CURL_META=$(curl -4 -sS --connect-timeout 10 --max-time 30 \
          -o /dev/null \
          -w "%{http_code} remote_ip=%{remote_ip} connect=%{time_connect}s first_byte=%{time_starttransfer}s total=%{time_total}s" \
          -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
          -H "Accept-Language: zh-TW,zh;q=0.9" \
          "https://www.mvdis.gov.tw/m3-emv-plate/webpickno/queryPickNo")
        CURL_EXIT=$?
        set -e
        HTTP_STATUS=$(awk '{ print $1 }' <<< "$CURL_META")
        HTTP_STATUS=${HTTP_STATUS:-000}
        echo "MVDIS shell probe: curl=$CURL_EXIT $CURL_META"

        if [ "$CURL_EXIT" -ne 0 ] || [ "$HTTP_STATUS" = "000" ]; then
          echo "::warning::MVDIS shell preflight inconclusive: curl=$CURL_EXIT HTTP=$HTTP_STATUS; Chromium preflight remains authoritative."
        elif [ "$HTTP_STATUS" = "403" ] || [ "$HTTP_STATUS" = "429" ] || [ "$HTTP_STATUS" = "503" ]; then
          echo "::warning::MVDIS returned HTTP $HTTP_STATUS; Chromium recovery will classify the actual browser path."
        else
          echo "MVDIS shell path is reachable (HTTP $HTTP_STATUS); Chromium still performs the authoritative probe."
        fi

        echo "=== Supabase Connectivity ==="
        for ATTEMPT in 1 2 3 4 5; do
          if curl -4 -I -sS --max-time 15 "$SUPABASE_URL" > /dev/null; then break; fi
          echo "Retry $ATTEMPT failed..."
          sleep 5
        done

    - name: Verify Gemini API Direct Egress
      shell: bash
      env:
        GEMINI_API_KEY: ${{ inputs.gemini-api-key }}
        GEMINI_API_KEY_NORTH: ${{ inputs.gemini-api-key-north }}
        GEMINI_API_KEY_CENTRAL: ${{ inputs.gemini-api-key-central }}
        GEMINI_API_KEY_SOUTH: ${{ inputs.gemini-api-key-south }}
        GEMINI_API_KEY_SHARD4: ${{ inputs.gemini-api-key-shard4 }}
        GEMINI_API_KEY_SHARD5: ${{ inputs.gemini-api-key-shard5 }}
      run: |
        # 2026-11-10（健檢 O2）：直連出口 IP 金絲雀原本是單次 `curl api.ipify.org`（--max-time 15）。
        # 11/8 15:23 ipify 一次逾時，7 個 job（primary 與 recovery 同時）在 80 秒內死在 setup。
        # 改成有上限的重試＋備援端點；回傳值必須像 IPv4，否則視為失敗（避免空字串 == 空字串 讓金絲雀假通過）。
        # 兩個端點都必須在 WARP 的 `tunnel host add` 排除清單內（見下方 HOST 迴圈），
        # 這樣 WARP 開啟後不論哪個端點回答，看到的都是 GitHub 直連 IP，split-tunnel 判定語意不變。
        # 用法：fetch_direct_ipv4 [偏好端點]，成功時輸出「<端點> <IPv4>」。AFTER 傳入 BEFORE 回答的端點，
        # 優先問同一個服務（不同服務看到的 IP 理論上相同，但同端點比對最不容易誤判）。
        # 注意：迴圈變數刻意不叫 ATTEMPT（Gemini 預檢步驟用它，測試的假 curl 也靠它分辨呼叫）。
        fetch_direct_ipv4() {
          local TRY ENDPOINT RESULT
          local ENDPOINTS=(https://api.ipify.org https://checkip.amazonaws.com)
          if [ "${1:-}" = "https://checkip.amazonaws.com" ]; then
            ENDPOINTS=(https://checkip.amazonaws.com https://api.ipify.org)
          fi
          for TRY in 1 2 3; do
            for ENDPOINT in "${ENDPOINTS[@]}"; do
              RESULT=$(curl -4 -fsS --max-time 15 "$ENDPOINT" 2>/dev/null || true)
              RESULT=${RESULT//[[:space:]]/}
              if [[ "$RESULT" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
                echo "$ENDPOINT $RESULT"
                return 0
              fi
              echo "::warning::Direct IPv4 lookup via $ENDPOINT failed (round $TRY/3)." >&2
            done
            if [ "$TRY" -lt 3 ]; then sleep $((TRY * 3)); fi
          done
          return 1
        }

        IFS=',' read -r -a SHARD_LIST <<< "${{ inputs.shards }}"
        for SHARD in "${SHARD_LIST[@]}"; do
          case "$SHARD" in
            NORTH) PRIMARY_KEY="$GEMINI_API_KEY_NORTH" ;;
            CENTRAL) PRIMARY_KEY="$GEMINI_API_KEY_CENTRAL" ;;
            SOUTH) PRIMARY_KEY="$GEMINI_API_KEY_SOUTH" ;;
            SHARD4) PRIMARY_KEY="$GEMINI_API_KEY_SHARD4" ;;
            SHARD5) PRIMARY_KEY="$GEMINI_API_KEY_SHARD5" ;;
            *) echo "::error::Unknown shard: $SHARD"; exit 1 ;;
          esac

          if [ -z "$PRIMARY_KEY" ]; then
            echo "::error::Primary Gemini key is empty for shard $SHARD."
            exit 1
          fi

          # 僅供診斷顯示（真正的預檢是下面的 generateContent 呼叫，失敗會正確 fail），查不到 IP 不應讓整條 lane 陣亡。
          if DIRECT_RESULT=$(fetch_direct_ipv4); then DIRECT_IP=${DIRECT_RESULT#* }; else DIRECT_IP="UNKNOWN"; fi
          echo "Gemini direct egress IPv4 for $SHARD: $DIRECT_IP"
          MAX_ATTEMPTS=3
          PREFLIGHT_OUTCOME=""
          PREFLIGHT_FILE="/tmp/gemini-preflight-${SHARD}.json"

          for ATTEMPT in $(seq 1 "$MAX_ATTEMPTS"); do
            rm -f "$PREFLIGHT_FILE"
            set +e
            CURL_META=$(curl -4 -sS --connect-timeout 10 --max-time 30 \
              -o "$PREFLIGHT_FILE" \
              -w "%{http_code} remote_ip=%{remote_ip} connect=%{time_connect}s tls=%{time_appconnect}s first_byte=%{time_starttransfer}s total=%{time_total}s" \
              -H "x-goog-api-key: $PRIMARY_KEY" \
              -H "Content-Type: application/json" \
              -d '{"contents":[{"parts":[{"text":"Reply OK"}]}],"generationConfig":{"maxOutputTokens":1}}' \
              "https://generativelanguage.googleapis.com/v1beta/models/gemma-4-26b-a4b-it:generateContent")
            CURL_EXIT=$?
            set -e

            HTTP_STATUS=$(awk '{print $1}' <<< "$CURL_META")
            HTTP_STATUS=${HTTP_STATUS:-000}
            echo "Gemini preflight $SHARD attempt $ATTEMPT/$MAX_ATTEMPTS: curl=$CURL_EXIT $CURL_META"

            if [ "$CURL_EXIT" -ne 0 ]; then
              case "$CURL_EXIT" in
                6|7|18|28|35|52|55|56|92)
                  if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
                    WAIT_SECONDS=$((ATTEMPT * 5))
                    echo "::warning::Transient Gemini transport error (curl $CURL_EXIT); retrying in ${WAIT_SECONDS}s."
                    sleep "$WAIT_SECONDS"
                    continue
                  fi
                  PREFLIGHT_OUTCOME="transient-exhausted"
                  break
                  ;;
                *)
                  echo "::error::Non-retryable Gemini transport error (curl $CURL_EXIT)."
                  exit 1
                  ;;
              esac
            fi

            case "$HTTP_STATUS" in
              200)
                PREFLIGHT_OUTCOME="passed"
                break
                ;;
              400|401|403|404)
                echo "::error::Gemini preflight failed with permanent HTTP $HTTP_STATUS."
                head -c 2000 "$PREFLIGHT_FILE" || true
                echo
                exit 1
                ;;
              429)
                echo "::warning::Gemini preflight received HTTP 429; deferring quota handling to the crawler key/model ladder."
                PREFLIGHT_OUTCOME="deferred-to-crawler"
                break
                ;;
              408|425|500|502|503|504)
                if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
                  WAIT_SECONDS=$((ATTEMPT * 5))
                  echo "::warning::Transient Gemini HTTP $HTTP_STATUS; retrying in ${WAIT_SECONDS}s."
                  sleep "$WAIT_SECONDS"
                  continue
                fi
                PREFLIGHT_OUTCOME="transient-exhausted"
                break
                ;;
              *)
                echo "::error::Gemini preflight failed with unexpected HTTP $HTTP_STATUS."
                head -c 2000 "$PREFLIGHT_FILE" || true
                echo
                exit 1
                ;;
            esac
          done

          case "$PREFLIGHT_OUTCOME" in
            passed)
              echo "Gemini generateContent preflight passed via direct GitHub egress."
              ;;
            deferred-to-crawler)
              echo "Gemini route/auth preflight was inconclusive due to quota; crawler safeguards remain authoritative."
              ;;
            transient-exhausted)
              echo "::warning::Gemini preflight transient failure after $MAX_ATTEMPTS attempts; allowing the crawler retry ladder to decide availability."
              ;;
            *)
              echo "::error::Gemini preflight ended without a classified outcome."
              exit 1
              ;;
          esac
        done
